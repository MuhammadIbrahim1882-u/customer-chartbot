<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Harbor Goods Support</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
/* Harbor Goods Support — design system v2 */
:root {
  --fog: #e4ecf2;
  --paper: #ffffff;
  --ink: #0c2236;
  --muted: #5d7283;
  --line: #d9e3eb;
  --harbor: #1463a8;
  --harbor-deep: #0e4c85;
  --sea: #2a9d8f;
  --ok: #1c9a6b;
  --stream: #f5f8fb;
  --dot: rgba(12, 34, 54, .07);
  --side-top: #0a1d2e;
  --side-bottom: #14405f;
  --danger: #b3261e;
  --pill-processing-bg: #fff1cf; --pill-processing-fg: #8a5a00;
  --pill-shipped-bg: #dcebfb;    --pill-shipped-fg: #0e4c85;
  --pill-delivered-bg: #d9f3e7;  --pill-delivered-fg: #146c49;
  --shadow: 0 1px 2px rgba(12, 34, 54, .06), 0 24px 48px -18px rgba(12, 34, 54, .35);
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root {
    --fog: #07121c;
    --paper: #0f2233;
    --ink: #e8f0f6;
    --muted: #8aa1b3;
    --line: #1f3a50;
    --harbor: #3d8fd9;
    --harbor-deep: #2f7ac0;
    --stream: #0b1b29;
    --dot: rgba(255, 255, 255, .05);
    --side-top: #0f2233;
    --side-bottom: #0b3a52;
    --pill-processing-bg: rgba(245, 166, 35, .18); --pill-processing-fg: #f3b955;
    --pill-shipped-bg: rgba(61, 143, 217, .2);     --pill-shipped-fg: #86bdf0;
    --pill-delivered-bg: rgba(28, 154, 107, .2);   --pill-delivered-fg: #5fd6a4;
    --shadow: 0 24px 48px -18px rgba(0, 0, 0, .7);
  }
}

* { box-sizing: border-box; }
html, body { height: 100%; }

body {
  margin: 0;
  background:
    radial-gradient(800px 480px at 105% -10%, rgba(42, 157, 143, .2), transparent 60%),
    radial-gradient(700px 420px at -10% 110%, rgba(20, 99, 168, .16), transparent 60%),
    var(--fog);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

.app {
  max-width: 1120px;
  height: 100vh;
  height: 100dvh;
  margin: 0 auto;
  padding: 28px;
  display: grid;
  grid-template-columns: 330px minmax(0, 1fr);
  gap: 22px;
}

/* ---------- Sidebar: the one bold element ---------- */
.side {
  position: relative;
  isolation: isolate;
  overflow-y: auto;
  border-radius: 26px;
  padding: 30px 28px 26px;
  color: #e6f0f7;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow);
  background:
    radial-gradient(120% 50% at 50% 115%, rgba(42, 157, 143, .6), transparent 62%),
    linear-gradient(168deg, var(--side-top), var(--side-bottom));
}
/* layered wave lines */
.side::before {
  content: "";
  position: absolute;
  inset: auto 0 0 0;
  height: 46%;
  z-index: -1;
  opacity: .5;
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 330 220' preserveAspectRatio='none'><g fill='none' stroke='%23ffffff' stroke-opacity='.22' stroke-width='1.2'><path d='M0 60 C60 20 110 100 170 60 S280 20 330 60'/><path d='M0 90 C60 50 110 130 170 90 S280 50 330 90'/><path d='M0 120 C60 80 110 160 170 120 S280 80 330 120'/><path d='M0 150 C60 110 110 190 170 150 S280 110 330 150'/><path d='M0 180 C60 140 110 220 170 180 S280 140 330 180'/></g></svg>") center bottom / 100% 100% no-repeat;
}

.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 38px; }
.mark {
  display: grid; place-items: center;
  width: 36px; height: 36px;
  border-radius: 11px;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 18px;
  color: #fff;
  background: linear-gradient(145deg, #3d8fd9, var(--sea));
  box-shadow: 0 6px 14px -4px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .35);
}
.word { font-family: var(--font-display); font-weight: 600; font-size: 17px; letter-spacing: -.01em; }

.side h1 {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 42px;
  line-height: 1;
  letter-spacing: -.035em;
  margin: 0 0 16px;
}
.lead { margin: 0; color: #aac2d3; font-size: 14.5px; max-width: 26ch; }

.side h2 { font-family: var(--font-display); font-size: 14px; font-weight: 600; margin: 32px 0 10px; color: #cfe0ec; }

.topics { display: flex; flex-direction: column; gap: 3px; }
.topics button {
  text-align: left;
  background: transparent;
  border: 0;
  border-left: 2px solid rgba(255, 255, 255, .16);
  border-radius: 0 10px 10px 0;
  padding: 9px 14px;
  font: inherit;
  font-size: 14px;
  color: #dbe8f1;
  cursor: pointer;
  transition: background .18s, border-color .18s, padding-left .18s;
}
.topics button:hover { background: rgba(255, 255, 255, .09); border-left-color: #6fd0c4; padding-left: 19px; }

.hours {
  margin-top: auto;
  padding-top: 26px;
  font-size: 13px;
  line-height: 1.6;
  color: #bcd0de;
  display: flex;
  flex-direction: column;
}
.hours strong { color: #fff; font-family: var(--font-display); font-weight: 600; }
.demo {
  margin-top: 10px;
  padding: 8px 10px;
  font-size: 12px;
  border-radius: 10px;
  background: rgba(255, 255, 255, .08);
  border: 1px solid rgba(255, 255, 255, .12);
  backdrop-filter: blur(6px);
}

/* ---------- Chat card ---------- */
.chat {
  background: var(--paper);
  border-radius: 26px;
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}

.chat-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 22px;
  background: var(--paper);
  border-bottom: 1px solid var(--line);
}
.who { position: relative; display: flex; flex-direction: column; line-height: 1.25; padding-left: 54px; }
.who::before {
  content: "H";
  position: absolute; left: 0; top: 50%;
  transform: translateY(-50%);
  width: 42px; height: 42px;
  border-radius: 13px;
  display: grid; place-items: center;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 20px;
  color: #fff;
  background: linear-gradient(145deg, var(--harbor), var(--sea));
  box-shadow: 0 8px 16px -8px rgba(20, 99, 168, .8), inset 0 1px 0 rgba(255, 255, 255, .3);
}
.who strong { font-family: var(--font-display); font-size: 17px; letter-spacing: -.01em; }

.status { display: inline-flex; align-items: center; gap: 7px; margin-top: 1px; font-size: 12.5px; color: var(--ok); }
.status::before {
  content: "";
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--ok);
  animation: pulse 2.4s ease-out infinite;
}
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(28, 154, 107, .55); }
  70%, 100% { box-shadow: 0 0 0 8px rgba(28, 154, 107, 0); }
}

.ghost {
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 7px 14px;
  font: inherit;
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
  cursor: pointer;
  transition: color .15s, border-color .15s, background .15s;
}
.ghost:hover { color: var(--ink); border-color: var(--ink); background: var(--stream); }

/* ---------- Messages ---------- */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 26px 22px 12px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  scroll-behavior: smooth;
  background:
    radial-gradient(var(--dot) 1px, transparent 1.2px) 0 0 / 18px 18px,
    var(--stream);
}
.messages::-webkit-scrollbar { width: 8px; }
.messages::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }

.msg {
  position: relative;
  max-width: min(76%, 580px);
  padding: 11px 16px;
  border-radius: 18px;
  line-height: 1.55;
  word-wrap: break-word;
  animation: pop .22s ease-out;
}
@keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.98); } to { opacity: 1; transform: none; } }

.msg.bot {
  margin-left: 42px;
  align-self: flex-start;
  background: var(--paper);
  border: 1px solid var(--line);
  border-bottom-left-radius: 5px;
  box-shadow: 0 2px 6px -2px rgba(12, 34, 54, .1);
}
.msg.bot::before {
  content: "H";
  position: absolute; left: -42px; bottom: 0;
  width: 30px; height: 30px;
  border-radius: 10px;
  display: grid; place-items: center;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 13px;
  color: #fff;
  background: linear-gradient(145deg, var(--harbor), var(--sea));
}
.msg.user {
  align-self: flex-end;
  color: #fff;
  background: linear-gradient(145deg, var(--harbor), var(--harbor-deep));
  border-bottom-right-radius: 5px;
  box-shadow: 0 10px 18px -8px rgba(20, 99, 168, .6);
}
.msg time { display: block; margin-top: 4px; font-size: 11px; opacity: .55; }
.msg.user time { text-align: right; }

.typing { display: inline-flex; gap: 5px; padding: 15px 16px; }
.typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.1s infinite; }
.typing span:nth-child(2) { animation-delay: .15s; }
.typing span:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; transform: none; } 40% { opacity: 1; transform: translateY(-3px); } }

/* ---------- Order card ---------- */
.msg:has(.order) { min-width: min(320px, 100%); }
.order-top { display: flex; justify-content: space-between; align-items: center; gap: 14px; }
.order-top b { font-family: var(--font-display); font-size: 17px; letter-spacing: -.01em; }
.order-items { color: var(--muted); font-size: 13.5px; }
.order p { margin: 0; font-size: 14px; }

.pill { font-size: 12px; font-weight: 600; padding: 3px 11px; border-radius: 999px; }
.pill-processing { background: var(--pill-processing-bg); color: var(--pill-processing-fg); }
.pill-shipped { background: var(--pill-shipped-bg); color: var(--pill-shipped-fg); }
.pill-delivered { background: var(--pill-delivered-bg); color: var(--pill-delivered-fg); }

.track { list-style: none; margin: 16px 0 12px; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); }
.track li { position: relative; padding-top: 22px; text-align: center; font-size: 12px; color: var(--muted); }
.track li::before {
  content: "";
  position: absolute; top: 0; left: 50%;
  width: 13px; height: 13px; margin-left: -6.5px;
  border-radius: 50%;
  background: var(--line);
  border: 2px solid var(--paper);
  z-index: 1;
}
.track li::after { content: ""; position: absolute; top: 5px; left: -50%; width: 100%; height: 3px; background: var(--line); }
.track li:first-child::after { display: none; }
.track li.done { color: var(--ink); font-weight: 600; }
.track li.done::before, .track li.done::after { background: var(--sea); }

/* ---------- Quick replies ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 22px 16px 64px; background: var(--stream); }
.chips:empty { padding: 0; }
.chips button {
  background: var(--paper);
  border: 1px solid var(--harbor);
  color: var(--harbor);
  border-radius: 999px;
  padding: 7px 15px;
  font: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: background .15s, color .15s, transform .15s, box-shadow .15s;
}
.chips button:hover { background: var(--harbor); color: #fff; transform: translateY(-1px); box-shadow: 0 8px 14px -8px rgba(20, 99, 168, .8); }
.chips button:active { transform: none; }

/* ---------- Ticket form ---------- */
.ticket {
  margin-left: 42px;
  align-self: flex-start;
  width: min(390px, 90%);
  display: grid;
  gap: 10px;
  padding: 18px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 18px;
  box-shadow: 0 16px 30px -16px rgba(12, 34, 54, .4);
  animation: pop .22s ease-out;
}
.ticket input, .ticket textarea {
  width: 100%;
  font: inherit;
  font-size: 14px;
  color: var(--ink);
  background: var(--stream);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
}
.ticket textarea { min-height: 84px; resize: vertical; }
.ticket button {
  border: 0;
  border-radius: 10px;
  padding: 11px;
  font: inherit;
  font-weight: 600;
  color: #fff;
  background: linear-gradient(145deg, var(--harbor), var(--harbor-deep));
  cursor: pointer;
}
.ticket button:hover { filter: brightness(1.08); }
.ticket .err { margin: 0; font-size: 13px; color: var(--danger); }
.ticket .err[hidden] { display: none; }

/* ---------- Composer ---------- */
.composer { display: flex; gap: 10px; padding: 14px 18px 18px; background: var(--paper); border-top: 1px solid var(--line); }
.composer input {
  flex: 1; min-width: 0;
  font: inherit;
  color: var(--ink);
  background: var(--stream);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 13px 18px;
  transition: border-color .15s, box-shadow .15s, background .15s;
}
.composer input::placeholder { color: var(--muted); }
.composer input:focus { outline: none; background: var(--paper); border-color: var(--harbor); box-shadow: 0 0 0 4px rgba(20, 99, 168, .16); }
.composer button {
  display: inline-flex; align-items: center; gap: 8px;
  border: 0;
  border-radius: 16px;
  padding: 0 22px;
  font: inherit;
  font-weight: 600;
  color: #fff;
  background: linear-gradient(145deg, var(--harbor), var(--harbor-deep));
  box-shadow: 0 10px 18px -10px rgba(20, 99, 168, .9), inset 0 1px 0 rgba(255, 255, 255, .25);
  cursor: pointer;
  transition: transform .15s, filter .15s;
}
.composer button:hover { filter: brightness(1.08); transform: translateY(-1px); }
.composer button:active { transform: none; }

.ticket input:focus, .ticket textarea:focus { outline: 2px solid var(--harbor); outline-offset: 1px; }
button:focus-visible { outline: 2px solid var(--harbor); outline-offset: 2px; }
.side button:focus-visible { outline-color: #6fd0c4; }

/* ---------- Responsive ---------- */
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; padding: 0; gap: 0; }
  .side { display: none; }
  .chat { border-radius: 0; border: 0; box-shadow: none; }
  .msg { max-width: 88%; }
  .composer button span { display: none; }
  .composer button { padding: 0 16px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

/* ===== v3 pro refinements (override earlier rules) ===== */
:root { --tint: rgba(20, 99, 168, .09); }
@media (prefers-color-scheme: dark) { :root { --tint: rgba(61, 143, 217, .18); } }

/* Branded chat header */
.chat-head {
  padding: 18px 24px;
  border-bottom: 0;
  color: #fff;
  background:
    radial-gradient(120% 220% at 100% 0%, rgba(111, 208, 196, .38), transparent 55%),
    linear-gradient(120deg, #0e4c85, #1463a8 55%, #2a9d8f);
}
.who::before {
  background: rgba(255, 255, 255, .18);
  border: 1px solid rgba(255, 255, 255, .38);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45);
}
.who strong { color: #fff; font-size: 18px; }
.status { color: #c9f3e4; }
.status::before { background: #5fe3a8; }
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(95, 227, 168, .6); }
  70%, 100% { box-shadow: 0 0 0 8px rgba(95, 227, 168, 0); }
}
.chat-head .ghost { color: #fff; border-color: rgba(255, 255, 255, .42); background: rgba(255, 255, 255, .1); }
.chat-head .ghost:hover { color: var(--harbor-deep); background: #fff; border-color: #fff; }

/* Sidebar topics as tiles with a chevron */
.topics { gap: 8px; }
.topics button {
  position: relative;
  padding: 12px 38px 12px 14px;
  font-weight: 500;
  border: 1px solid rgba(255, 255, 255, .12);
  border-radius: 12px;
  background: rgba(255, 255, 255, .05);
}
.topics button::after {
  content: "";
  position: absolute; right: 16px; top: 50%;
  width: 7px; height: 7px;
  border-top: 2px solid currentColor;
  border-right: 2px solid currentColor;
  transform: translateY(-50%) rotate(45deg);
  opacity: .5;
}
.topics button:hover {
  padding-left: 14px;
  background: rgba(255, 255, 255, .13);
  border-color: rgba(111, 208, 196, .75);
  transform: translateX(3px);
}

/* Soft tinted quick replies */
.chips button { background: var(--tint); border-color: transparent; color: var(--harbor); }
.chips button:hover { background: var(--harbor); color: #fff; }

/* Floating composer */
.composer { background: var(--stream); border-top: 0; padding: 8px 20px 20px; }
.composer input {
  background: var(--paper);
  border-radius: 999px;
  padding: 14px 22px;
  box-shadow: 0 8px 20px -12px rgba(12, 34, 54, .45);
}
.composer button { border-radius: 999px; padding: 0 26px; }

@media (max-width: 860px) {
  .app { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
}

</style>
</head>
<body>
  <main class="app">
    <aside class="side">
      <div class="brand"><span class="mark">H</span><span class="word">Harbor Goods</span></div>
      <h1>How can we<br>help today?</h1>
      <p class="lead">Ask about orders, shipping, returns or payments. A person can take over any time.</p>

      <h2>Quick topics</h2>
      <div class="topics" id="topics"></div>

      <div class="hours">
        <strong>Human agents</strong>
        Mon–Fri, 9:00–18:00
        <span class="demo">Demo orders: ORD-1001, ORD-1002, ORD-1003</span>
      </div>
    </aside>

    <section class="chat" aria-label="Support chat">
      <header class="chat-head">
        <div class="who">
          <strong>Harbor Assistant</strong>
          <span class="status">Online · replies instantly</span>
        </div>
        <button id="clearBtn" class="ghost" type="button">Clear chat</button>
      </header>

      <div class="messages" id="messages" aria-live="polite"></div>
      <div class="chips" id="chips"></div>

      <div class="composer">
        <input id="input" type="text" placeholder="Type your question…" autocomplete="off" aria-label="Your message">
        <button id="sendBtn" type="button">
          <span>Send</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
        </button>
      </div>
    </section>
  </main>

  <script>
// Edit this file to change what the bot knows. No other file needs to change.
window.KB = {
  storeName: "Harbor Goods",

  welcome: "Hi, I'm the Harbor Goods assistant. I can track an order, explain shipping and returns, or connect you with a person. What do you need?",

  fallback: "I'm not sure I understood that. You can ask about orders, shipping, returns, refunds, payments or your account, or ask for a human agent.",

  defaultChips: ["Track my order", "Shipping times", "Return an item", "Payment methods", "Talk to a human"],

  // Demo orders for the tracking feature
  orders: {
    "ORD-1001": { status: "Delivered", detail: "Delivered on 24 Sep 2026 to your front door.", items: "Canvas Backpack" },
    "ORD-1002": { status: "Shipped", detail: "In transit with Express Courier. Expected delivery: 3 Oct 2026.", items: "Steel Water Bottle x2" },
    "ORD-1003": { status: "Processing", detail: "We're packing your order. It ships within 1 business day.", items: "Linen Throw Blanket" }
  },

  // Each intent: keywords are matched against the user's message (more matches = higher score)
  intents: [
    {
      id: "greeting",
      keywords: ["hi", "hello", "hey", "good morning", "good evening", "salam", "assalam"],
      answer: "Hello! How can I help you today?",
      chips: ["Track my order", "Return an item", "Talk to a human"]
    },
    {
      id: "thanks",
      keywords: ["thanks", "thank you", "thx", "shukriya", "appreciate"],
      answer: "You're welcome! Is there anything else I can help with?",
      chips: ["Shipping times", "Talk to a human"]
    },
    {
      id: "bye",
      keywords: ["bye", "goodbye", "see you", "that's all", "nothing else"],
      answer: "Thanks for contacting Harbor Goods. Have a great day!",
      chips: []
    },
    {
      id: "track",
      keywords: ["track", "where is my order", "order status", "my order", "delivery status", "parcel", "package"],
      answer: "To track an order, send me your order ID (for example <b>ORD-1002</b>). You'll find it in your confirmation email.",
      chips: ["ORD-1001", "ORD-1002", "ORD-1003"]
    },
    {
      id: "shipping",
      keywords: ["shipping", "delivery", "deliver", "how long", "ship", "courier", "arrive", "international"],
      answer: "<b>Shipping times</b><br>Standard: 3–5 business days (free over $50, otherwise $4.99)<br>Express: 1–2 business days ($12.99)<br>International: 7–14 business days, rates shown at checkout.",
      chips: ["Track my order", "Return an item"]
    },
    {
      id: "returns",
      keywords: ["return", "send back", "exchange", "wrong item", "damaged", "broken", "defective"],
      answer: "You can return most items within <b>30 days</b> of delivery if they're unused and in original packaging.<br>1. Go to My Orders and choose <b>Start a return</b>.<br>2. Print the prepaid label.<br>3. Drop the parcel at any courier point.<br>Damaged or wrong item? Tell us and we'll cover the shipping.",
      chips: ["Refund timing", "Talk to a human"]
    },
    {
      id: "refund",
      keywords: ["refund", "money back", "reimburse", "cancel order", "cancel", "cancellation"],
      answer: "Refunds go back to your original payment method <b>5–7 business days</b> after we receive the return. Orders can be cancelled free of charge until they ship.",
      chips: ["Return an item", "Payment methods"]
    },
    {
      id: "payment",
      keywords: ["payment", "pay", "card", "visa", "mastercard", "paypal", "cash on delivery", "cod", "charged", "invoice"],
      answer: "We accept Visa, Mastercard, PayPal and cash on delivery (domestic orders only). All card payments are encrypted. If you were charged twice, a human agent can check it for you.",
      chips: ["Talk to a human", "Refund timing"]
    },
    {
      id: "account",
      keywords: ["account", "password", "login", "log in", "sign in", "forgot", "reset", "email change"],
      answer: "To reset your password, choose <b>Forgot password</b> on the sign-in page and follow the email link (it expires in 30 minutes). Check your spam folder if it doesn't arrive.",
      chips: ["Talk to a human"]
    },
    {
      id: "hours",
      keywords: ["hours", "open", "contact", "phone", "support time", "working hours", "address"],
      answer: "Our human agents are available Monday to Friday, 9:00–18:00. You can also email support@harborgoods.example any time.",
      chips: ["Talk to a human"]
    },
    {
      id: "discount",
      keywords: ["discount", "coupon", "promo", "voucher", "sale", "offer", "code"],
      answer: "Enter your promo code at checkout. Codes can't be combined, and they don't apply to sale items. New customers get 10% off with <b>WELCOME10</b>.",
      chips: ["Shipping times", "Payment methods"]
    },
    {
      id: "human",
      keywords: ["human", "agent", "person", "representative", "talk to someone", "real person", "complaint", "manager", "speak"],
      answer: "Of course. Leave your details and a human agent will reply by email within one business day.",
      chips: [],
      action: "ticket"
    }
  ]
};

</script>
  <script>
(function () {
  "use strict";

  var KB = window.KB;
  var STORE_KEY = "harbor_chat_history";
  var TICKETS_KEY = "harbor_tickets";

  var messagesEl = document.getElementById("messages");
  var chipsEl = document.getElementById("chips");
  var topicsEl = document.getElementById("topics");
  var inputEl = document.getElementById("input");
  var sendBtn = document.getElementById("sendBtn");
  var clearBtn = document.getElementById("clearBtn");

  var history = [];

  // ---------- storage helpers (safe if storage is blocked) ----------
  function load(key, fallback) {
    try { return JSON.parse(localStorage.getItem(key)) || fallback; }
    catch (e) { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* ignore */ }
  }

  // ---------- rendering ----------
  function timeNow() {
    return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }

  function scrollDown() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function renderMessage(who, text, time, isHtml) {
    var div = document.createElement("div");
    div.className = "msg " + who;
    var body = document.createElement("span");
    if (isHtml) { body.innerHTML = text; } else { body.textContent = text; }
    var t = document.createElement("time");
    t.textContent = time;
    div.appendChild(body);
    div.appendChild(t);
    messagesEl.appendChild(div);
    scrollDown();
  }

  function addMessage(who, text, isHtml) {
    var time = timeNow();
    renderMessage(who, text, time, isHtml);
    history.push({ who: who, text: text, time: time, html: !!isHtml });
    save(STORE_KEY, history);
  }

  function setChips(list) {
    chipsEl.innerHTML = "";
    (list || []).forEach(function (label) {
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = label;
      b.addEventListener("click", function () { handleUser(label); });
      chipsEl.appendChild(b);
    });
  }

  function showTyping() {
    var div = document.createElement("div");
    div.className = "msg bot typing";
    div.innerHTML = "<span></span><span></span><span></span>";
    messagesEl.appendChild(div);
    scrollDown();
    return div;
  }

  function botReply(text, chips, action) {
    setChips([]);
    var typing = showTyping();
    var delay = 450 + Math.min(text.length * 6, 900);
    setTimeout(function () {
      typing.remove();
      addMessage("bot", text, true);
      setChips(chips && chips.length ? chips : []);
      if (action === "ticket") { showTicketForm(); }
    }, delay);
  }

  // ---------- understanding the message ----------
  function normalize(s) {
    return " " + s.toLowerCase().replace(/[^\w\s'-]/g, " ").replace(/\s+/g, " ").trim() + " ";
  }

  function findOrderId(text) {
    var m = text.match(/ord[\s-]?(\d{4})/i);
    return m ? "ORD-" + m[1] : null;
  }

  function bestIntent(text) {
    var norm = normalize(text);
    var best = null;
    var bestScore = 0;
    KB.intents.forEach(function (intent) {
      var score = 0;
      intent.keywords.forEach(function (kw) {
        var k = kw.toLowerCase();
        // whole-word match for short words, substring for phrases
        var hit = k.indexOf(" ") === -1 ? norm.indexOf(" " + k + " ") !== -1 || norm.indexOf(" " + k + "s ") !== -1 : norm.indexOf(k) !== -1;
        if (hit) { score += 1 + k.split(" ").length * 0.5; }
      });
      if (score > bestScore) { bestScore = score; best = intent; }
    });
    return best;
  }

  function orderCard(id, o) {
    var steps = ["Processing", "Shipped", "Delivered"];
    var idx = steps.indexOf(o.status);
    var track = steps.map(function (st, i) {
      return '<li class="' + (i <= idx ? "done" : "") + '">' + st + "</li>";
    }).join("");
    return '<div class="order">' +
      '<div class="order-top"><b>' + id + '</b><span class="pill pill-' + o.status.toLowerCase() + '">' + o.status + "</span></div>" +
      '<div class="order-items">' + o.items + "</div>" +
      '<ol class="track">' + track + "</ol>" +
      "<p>" + o.detail + "</p></div>";
  }

  function orderAnswer(id) {
    var o = KB.orders[id];
    if (!o) {
      return {
        text: "I couldn't find an order called <b>" + id + "</b>. Check the ID in your confirmation email, or I can connect you to an agent.",
        chips: ["Talk to a human", "Track my order"]
      };
    }
    return {
      text: orderCard(id, o),
      chips: ["Return an item", "Shipping times"]
    };
  }

  // ---------- main handler ----------
  function handleUser(text) {
    text = text.trim();
    if (!text) { return; }
    addMessage("user", text, false);
    inputEl.value = "";

    var orderId = findOrderId(text);
    if (orderId) {
      var r = orderAnswer(orderId);
      botReply(r.text, r.chips);
      return;
    }

    var intent = bestIntent(text);
    if (intent) {
      botReply(intent.answer, intent.chips, intent.action);
    } else {
      botReply(KB.fallback, KB.defaultChips);
    }
  }

  // ---------- human handoff ticket ----------
  function showTicketForm() {
    var box = document.createElement("div");
    box.className = "ticket";
    box.innerHTML =
      '<input type="text" placeholder="Your name" aria-label="Your name" id="tName">' +
      '<input type="email" placeholder="Email address" aria-label="Email address" id="tEmail">' +
      '<textarea placeholder="Describe the problem" aria-label="Describe the problem" id="tIssue"></textarea>' +
      '<p class="err" id="tErr" hidden></p>' +
      '<button type="button" id="tSend">Send to an agent</button>';
    messagesEl.appendChild(box);
    scrollDown();

    box.querySelector("#tSend").addEventListener("click", function () {
      var name = box.querySelector("#tName").value.trim();
      var email = box.querySelector("#tEmail").value.trim();
      var issue = box.querySelector("#tIssue").value.trim();
      var err = box.querySelector("#tErr");
      var emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

      if (!name || !emailOk || issue.length < 5) {
        err.hidden = false;
        err.textContent = "Enter your name, a valid email and a short description of the problem.";
        return;
      }

      var tickets = load(TICKETS_KEY, []);
      var ticketId = "TCK-" + String(1000 + tickets.length + 1);
      tickets.push({ id: ticketId, name: name, email: email, issue: issue, created: new Date().toISOString() });
      save(TICKETS_KEY, tickets);

      box.remove();
      botReply("Thanks, " + escapeHtml(name) + ". Your request <b>" + ticketId + "</b> is with our team. We'll reply to " + escapeHtml(email) + " within one business day.", ["Shipping times", "Return an item"]);
    });
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // ---------- setup ----------
  function buildTopics() {
    ["Track my order", "Shipping times", "Return an item", "Refund timing", "Payment methods", "Reset my password", "Talk to a human"].forEach(function (label) {
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = label;
      b.addEventListener("click", function () { handleUser(label); });
      topicsEl.appendChild(b);
    });
  }

  function start() {
    messagesEl.innerHTML = "";
    history = [];
    save(STORE_KEY, history);
    botReply(KB.welcome, KB.defaultChips);
  }

  function restore() {
    var saved = load(STORE_KEY, []);
    if (!saved.length) { start(); return; }
    history = saved;
    saved.forEach(function (m) { renderMessage(m.who, m.text, m.time, m.html); });
    setChips(KB.defaultChips);
  }

  sendBtn.addEventListener("click", function () { handleUser(inputEl.value); });
  inputEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { handleUser(inputEl.value); }
  });
  clearBtn.addEventListener("click", start);

  buildTopics();
  restore();
  inputEl.focus();
})();

</script>
</body>
</html>
